name: محاسبه و ارسال نتیجه به داشبورد

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────
    #  ریپو پابلیک است ⇒ دقیقه های اکشنز نامحدود و رایگان
    #  ساعت ها UTC است. تهران = UTC + ۳:۳۰
    #  هر ۱۵ دقیقه، ۰۶ تا ۲۲ UTC (۰۹:۳۰ تا ۰۱:۳۰ تهران)،
    #  دوشنبه تا جمعه = کل سشن لندن + نیویورک با حاشیه
    #  آخر هفته خاموش چون بازار بسته است
    #
    #  توجه: فاصله باید کمتر از SNAPSHOT_MAX_AGE (پیش فرض ۴۵ دقیقه) بماند
    #  کرون گیت هاب گاهی ۱۰ تا ۴۰ دقیقه تاخیر دارد — طبیعی است
    # ─────────────────────────────────────────────────────────────────
    - cron: "*/15 6-22 * * 1-5"
  workflow_dispatch:        # دکمه اجرای دستی در تب Actions

# اگر اجرای قبلی تمام نشده، اجرای جدید صبر نکند و قبلی لغو شود
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: محاسبه و ارسال
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python build_snapshot.py
