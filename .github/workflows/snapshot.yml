name: محاسبه و ارسال نتیجه به داشبورد

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────
    #  ریپو پابلیک است ⇒ دقیقه های اکشنز نامحدود و رایگان
    #  ساعت ها UTC است. تهران = UTC + ۳:۳۰
    #  هر ۱۵ دقیقه، ۰۶ تا ۲۲ UTC (۰۹:۳۰ تا ۰۱:۳۰ تهران)،
    #  دوشنبه تا جمعه = کل سشن لندن + نیویورک با حاشیه
    #  آخر هفته خاموش چون بازار بسته است
    #
    #  توجه: فاصله باید کمتر از SNAPSHOT_MAX_AGE (پیش فرض ۴۵ دقیقه) بماند
    #  کرون گیت هاب گاهی ۱۰ تا ۴۰ دقیقه تاخیر دارد — طبیعی است
    # ─────────────────────────────────────────────────────────────────
    - cron: "*/15 6-22 * * 1-5"
  workflow_dispatch:        # دکمه اجرای دستی در تب Actions

# اگر اجرای قبلی تمام نشده، اجرای جدید صبر نکند و قبلی لغو شود
# اجازه نوشتن لازم است چون انبار پشتیبان در ریپو کامیت می شود
permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: محاسبه و ارسال
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python build_snapshot.py

      - name: کامیت انبار پشتیبان در ریپو
        run: |
          set -u
          if [ ! -f snapshot_cache.json ]; then
            echo "::warning::فایل پشتیبان ساخته نشد"
            exit 0
          fi
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -f snapshot_cache.json
          if git diff --cached --quiet; then
            echo "تغییری نبود"
            exit 0
          fi
          SZ=$(wc -c < snapshot_cache.json | tr -d ' ')
          # [skip render] لازم است وگرنه هر پوش سایت را ری استارت
          # می کند و دقیقا همان پاک شدن انباری که می خواهیم حلش کنیم
          # دوباره رخ می دهد.
          git commit -m "انبار محاسبه — ${SZ} بایت [skip render]"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git fetch -q origin "$BR" || true
            if ! git rebase "origin/$BR"; then
              git rebase --abort || true
            fi
            if git push origin "HEAD:refs/heads/$BR"; then
              echo "✅ انبار پشتیبان ذخیره شد"
              exit 0
            fi
            sleep 5
          done
          echo "::error::پوش انبار ناموفق — احتمالا اجازه نوشتن نیست:"
          echo "  Settings → Actions → General → Read and write"
          exit 1
